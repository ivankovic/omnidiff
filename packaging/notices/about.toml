# cargo-about's configuration for THIRD-PARTY-NOTICES.md (`make third-party-notices`): the
# licenses a shipped dependency may carry. Anything else fails the generation, which is the point -
# a new dependency under a license not listed here is a decision, not a surprise. Only what the
# product binary links: build and dev dependencies are left out, and the default feature set is
# what every binary distribution is built with.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # bzip2's own BSD-style license, carried by libbz2-rs-sys, the pure-Rust bzip2 that archive
    # diffing decompresses with.
    "bzip2-1.0.6",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "WTFPL",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The root crate itself: cargo-about resolves it too, and its license is not a third party's.
# Accepted here so the run succeeds; the template leaves its entry out.
[omnidiff]
accepted = ["AGPL-3.0-or-later"]

# Two crates embed data under a license of their own, which their Cargo.toml does not declare and
# whose notice must travel with the binary: hayro-interpret's standard PDF fonts (Foxit's, from
# PDFium, BSD-3-Clause) and hayro-cmap's CJK CMaps (Adobe's, BSD-3-Clause).
[hayro-interpret.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[hayro-interpret.clarify.files]]
path = "assets/LICENSE_FOXIT"
license = "BSD-3-Clause"
checksum = "b578cdd2345840ada550bd12519533812320d5f1d21cf4c1c7e1b1b0a31c98b7"

[hayro-cmap.clarify]
license = "(Apache-2.0 OR MIT) AND BSD-3-Clause"

[[hayro-cmap.clarify.files]]
path = "assets/LICENSE.txt"
license = "BSD-3-Clause"
checksum = "742665db9c8e1bc72603c6d319ca3e90b83bd6d95202f0cd4ef11068a07a9c29"
