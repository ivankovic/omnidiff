[package]
name = "omnidiff"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Fast, robust, accurate content-aware diffing"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ivankovic/omnidiff"
homepage = "https://ivankovic.github.io/omnidiff/showcase/"
readme = "README.md"
keywords = ["diff", "ast", "tree-sitter", "cli", "git"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# An allow-list: the checkout carries far more than the crate (fixture corpus, research/,
# packaging). src/test/*.rs ships because `mod test` compiles under cfg(test); its data does not.
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-COMMERCIAL",
    "/THIRD-PARTY-NOTICES.md",
    "/README.md",
    "/src/**/*.rs",
    # The JSON output's format, which the README links to.
    "/src/tui/json_output.schema.json",
    "!/src/bin/**",
    "!/src/test/data/**",
    # One stub per fixture, compiled only under `cfg(test)` and useless without src/test/data.
    "!/src/test/fixtures/*/**",
]

# `cargo binstall omnidiff`: the release workflow's asset names, as release.yml packages them -
# `omnidiff-<target>.tar.gz` with the binary at the archive root, `.zip` for Windows.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# A CPU-bound tool gains from optimizing across crates (tree-sitter, the engine's modules), at the
# cost of slower release builds.
[profile.release]
lto = "fat"
codegen-units = 1

# CI's and `make test`'s builds: optimized, because the fixture corpus is too slow unoptimized, but
# without the fat-LTO, single-codegen-unit link that every one of the ~25 test binaries pays under
# `release`. Measured 2026-10-02 on `nextest --features stats`: cold build 324 s -> 168 s, rebuild
# after touching the crate 241 s -> 76 s, fixture tests 92 s either way. Thin LTO was slower than
# fat (383 s / 322 s). Release artifacts and the timed benchmark keep `release`.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# cargo-deb metadata for the unofficial .deb; see packaging/README.md.
[package.metadata.deb]
maintainer = "Marko Ivankovic <marko@ivankovic.me>"
copyright = "2026 Marko Ivankovic"
license-file = ["LICENSE", "0"]
extended-description = """
OmniDiff parses both sides of a diff with tree-sitter and matches their syntax \
trees, so a change is reported as what it structurally is - an insertion, \
deletion, update, or move - rather than as whichever lines happened to align. \
It runs as an interactive terminal UI, a plain-text batch formatter, or a JSON \
emitter for editor integrations, and works as a git difftool backend and a \
Jujutsu (jj) diff formatter."""
section = "devel"
priority = "optional"
# $auto: cargo-deb reads the binary's ELF dependencies; the grammars are static.
depends = "$auto"
assets = [
    ["target/release/omnidiff", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/omnidiff/README.md", "644"],
    ["THIRD-PARTY-NOTICES.md", "usr/share/doc/omnidiff/THIRD-PARTY-NOTICES.md", "644"],
    # Generated by `omnidiff util man` / `util completions` before packaging (release.yml's `deb`
    # job): cargo-deb cannot run the binary, and a missing file fails the build, as intended.
    ["target/dist/omnidiff.1", "usr/share/man/man1/", "644"],
    ["target/dist/omnidiff.bash", "usr/share/bash-completion/completions/omnidiff", "644"],
    ["target/dist/_omnidiff", "usr/share/zsh/vendor-completions/", "644"],
    ["target/dist/omnidiff.fish", "usr/share/fish/vendor_completions.d/", "644"],
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", optional = true }
# clap_mangen 0.3 requires clap >= 4.6.6, which is why clap's own floor above is 4.6.6 rather
# than lower: the declared floor must be the effective one.
clap_mangen = { version = "0.3.3", optional = true }
confy = { version = "2.0.0", optional = true }
crossbeam-channel = { version = "0.5.15", optional = true }
csv = { version = "1.4.0", optional = true }
git2 = { version = "0.21", optional = true }
indoc = { version = "2.0.7", optional = true }
libc = { version = "0.2", optional = true }
num_cpus = { version = "1.17.0", optional = true }
rand = { version = "0.10", optional = true }
quick-xml = { version = "0.42", optional = true }
regex = { version = "1.12.2", optional = true }
# Terminal cell widths for `text_range::ScreenColumn`, needed outside the TUI too (headless). Already
# in the lockfile via ratatui.
unicode-width = "0.2"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = { version = "3.10.1", optional = true }
futures = { version = "0.3", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
tree-sitter = "0.25"
# Raster pictures (`diff::picture`): the formats binary diffs most often meet. No default
# features: those add AVIF/EXR/HDR codecs and rayon, none of which a diff needs.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
# An animation's frames are kept deflated (`diff::picture::Frames`); already built for `png`.
flate2 = "1.1"
# Archives (diff::content::archive), every decoder pure Rust: zip's default features would pull in
# C zstd, and bzip2's default backend is libbz2-rs-sys.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6"
# SVG cursors (diff::content::cursor), drawn to pictures; without text, which would pull in a
# second font stack.
resvg = { version = "0.48", default-features = false }
# Fonts (diff::content::font): glyphs read and drawn by skrifa, WOFF and WOFF2 unwrapped by wuff.
skrifa = "0.48"
wuff = "0.2"
# PDFs (diff::content::pdf): pages drawn by hayro, pure Rust; it is why the MSRV is 1.92. Its
# default features embed the standard 14 fonts and the CJK CMaps, for PDFs that do not embed theirs.
hayro = "0.7"
ratatui = { version = "0.30.2", features = ["serde", "macros"], optional = true }
crossterm = { version = "0.29.0", features = ["serde", "event-stream"], optional = true }
# Pictures drawn in the terminal: kitty, sixel or iTerm2 where the terminal speaks one, Unicode
# half blocks everywhere else. No default features: `chafa-dyn` links a system library.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-r = "1.3"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-vim = "0.4"
tree-sitter-xml = "0.7.0"
tree-sitter-yaml = "0.7"
# tree-sitter-perl/tree-sitter-perl, the grammar nvim-treesitter uses, is published under this name;
# the crate named `tree-sitter-perl` is another grammar (ganezdragon's), which parsed 481 of 825
# corpus Perl files without errors against this one's 789, and requires tree-sitter 0.26.
ts-parser-perl = "2.0"
walkdir = { version = "2", optional = true }
metrohash = "1.0.7"
rustc-hash = "2.1"
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"], optional = true }
tracing-error = { version = "0.2.1", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
syntect = { version = "5.2", features = ["default-fancy"], optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"], optional = true }

# Unix only: libc::raise(SIGTSTP) for Ctrl-Z in tui::app.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# musl's malloc is markedly slower on this allocation-heavy tool; only the musl targets link
# mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
# The same two crates the `test-fixtures` feature enables, for the `#[cfg(test)]` builds that
# compile src/test/ without that feature (see lib.rs's gate on `mod test`).
regex = "1.12.2"
tempfile = "3.10.1"
# The archive tests write the xz they read.
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }

[features]
# A bare `cargo install omnidiff` builds the TUI binary; a library consumer opts out with
# `default-features = false`.
default = ["tui"]
# Everything the TUI (src/tui/, src/main.rs) needs. Every dev-tool feature implies it: some of those
# bins use these deps directly, and tracking which ones is not worth it.
tui = [
    "dep:clap_complete",
    "dep:clap_mangen",
    "dep:ratatui",
    "dep:crossterm",
    "dep:ratatui-image",
    "dep:tokio",
    "dep:syntect",
    "dep:two-face",
    "dep:confy",
    "dep:futures",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-error",
]
# Gates `omnidiff::test`, whose data files are excluded from the published crate, so it must not
# be public API there. Needed by every src/bin/ dev tool; `stats` includes it.
test-fixtures = ["dep:csv", "dep:quick-xml", "dep:regex", "dep:tempfile", "tui"]
# git2 (with its OpenSSL/libssh2 build), bundled SQLite and the rest of the history
# stats/sampling tools' deps. Opt-in, so `cargo install omnidiff` and library consumers skip them.
stats = [
    "dep:git2",
    "dep:rusqlite",
    "dep:crossbeam-channel",
    "dep:libc",
    "dep:num_cpus",
    "dep:rand",
    "dep:indoc",
    "dep:walkdir",
    "test-fixtures",
]

# benchmark_other's harness end to end, through fake_diff_tool; both binaries and csv need
# test-fixtures.
[[test]]
name = "benchmark_other_e2e"
path = "tests/benchmark_other_e2e.rs"
required-features = ["test-fixtures"]

# The TUI's color depth, end to end: the real `omnidiff` binary on a pseudo-terminal, so gated like
# that binary. Linux only, which the file gates itself.
[[test]]
name = "tui_color_depth"
path = "tests/tui_color_depth.rs"
required-features = ["tui"]

[[bin]]
name = "omnidiff"
path = "src/main.rs"
required-features = ["tui"]

[[bin]]
name = "render_content_stills"
path = "src/bin/render_content_stills.rs"
# The README's content GIF (`make content-gif`): the content viewer drawn by the TUI's own widgets,
# step by step. A checkout-only dev tool, gated like render_tui_screenshot.
required-features = ["test-fixtures"]

[[bin]]
name = "render_tui_screenshot"
path = "src/bin/render_tui_screenshot.rs"
# The README's screenshot (`make readme-screenshot`), drawn by the TUI's own widgets. A
# checkout-only dev tool: gated like fake_diff_tool, so `cargo install --path .` leaves it out.
required-features = ["test-fixtures"]

[[bin]]
name = "ascii_visualizer"
path = "src/bin/ascii_visualizer.rs"
# Checkout-only dev tool; `test-fixtures` is the general gate for those.
required-features = ["test-fixtures"]

[[bin]]
name = "human_solver"
path = "src/bin/human_solver/main.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "benchmark_optimal_solutions"
path = "src/bin/benchmark_optimal_solutions.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "benchmark_content"
path = "src/bin/benchmark_content.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "benchmark_other"
path = "src/bin/benchmark_other.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "generate_mapping_site"
path = "src/bin/generate_mapping_site.rs"
required-features = ["test-fixtures"]

[[bin]]
# The GitHub Pages showcase: twenty fixture diffs baked into static JSON for assets/viewer/.
# `test-fixtures` for the corpus, the unix-diff labeller and the `showcase` module.
name = "generate_showcase"
path = "src/bin/generate_showcase.rs"
required-features = ["test-fixtures"]

[[bin]]
# Research-only: scores omnidiff against the Alikhanifard & Tsantalis AST node-mapping oracle
# (see research/external/README.md). Needs `csv`, hence the gate; touches nothing in the product.
name = "benchmark_astdiff_oracle"
path = "src/bin/benchmark_astdiff_oracle.rs"
required-features = ["test-fixtures"]

[[bin]]
# Not a diff tool: a stand-in that answers predictably (nothing changed / everything changed /
# a per-line hash / a crash) so `benchmark_other`'s harness can be scored against arithmetic
# instead of against a real tool whose correct answer nobody knows. Speaks difftastic's JSON, so
# `DIFFT_BIN` points at it and a real adapter is what runs. See tests/benchmark_other_e2e.rs.
name = "fake_diff_tool"
path = "src/bin/fake_diff_tool.rs"
# Checkout-only dev tool; see ascii_visualizer.
required-features = ["test-fixtures"]

[[bin]]
name = "diff_inventory"
path = "src/bin/diff_inventory.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "analyze_human_mappings"
path = "src/bin/analyze_human_mappings.rs"
required-features = ["test-fixtures"]

[[bin]]
name = "apted_only_worker"
path = "src/bin/apted_only_worker.rs"
# Spawned by apted_only_benchmark; checkout-only dev tool, see ascii_visualizer.
required-features = ["test-fixtures"]

[[bin]]
name = "apted_only_benchmark"
path = "src/bin/apted_only_benchmark.rs"
# Needs git2 (repo/blob access, same as benchmark_diff_pairs) and csv - both gated by `stats`.
