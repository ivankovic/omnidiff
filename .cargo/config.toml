# Build configuration shared by every cargo invocation in this tree.
[env]
# tree-sitter-vue-updated 0.1.0 vendors tree-sitter-html's C++ scanner and leaves its five
# `tree_sitter_html_external_scanner_*` symbols non-static, while its token enum names different
# tokens. Whichever copy the linker sees first wins for both crates, and the HTML grammar then
# misparses everything (the settings-example parse test fails if this goes away). The vendored
# copy is dead code - the Vue parser calls only the `tree_sitter_vue_*` wrappers - so renaming
# the five symbols via these defines neutralises it. Harmless to every other crate: no other
# C++ build defines names like these. DEVELOPER NOTE (2026-11): waiting on an upstream fix of
# c-gamble/tree-sitter-vue; when one lands, remove these. Until then any consumer of the
# published omnidiff crate that keeps its own dependency, rather than this tree, still has the
# collision: see AGENT_LOG.md.
CXXFLAGS = "-Dtree_sitter_html_external_scanner_create=vue_dead_html_scanner_create -Dtree_sitter_html_external_scanner_destroy=vue_dead_html_scanner_destroy -Dtree_sitter_html_external_scanner_serialize=vue_dead_html_scanner_serialize -Dtree_sitter_html_external_scanner_deserialize=vue_dead_html_scanner_deserialize -Dtree_sitter_html_external_scanner_scan=vue_dead_html_scanner_scan"
