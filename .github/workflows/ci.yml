name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and tests, it never writes to the repository.
permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one. Runs on main are never
# cancelled, so every commit there keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --check

  clippy:
    name: cargo clippy (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One pass per feature config, as in build-and-test below.
        features: ["", "test-fixtures", "stats"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.features }}

      - run: cargo clippy --tests --features "${{ matrix.features }}" -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: audit

      - run: cargo install cargo-audit --locked

      # No --ignore flags, and it should stay that way. An advisory that looks pinned by a
      # dependency (RUSTSEC-2026-0195/-0194, quick-xml via syntect -> plist) is usually held back
      # by this crate's own `rust-version` instead: the MSRV-aware resolver will not take a fixed
      # release that needs a newer Rust than the one claimed here. Raise the MSRV, do not ignore.
      - run: cargo audit

  mapping-site-js:
    name: JS tests (human_mapping site, showcase viewer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The Makefile targets, which make test and the pre-push hook also run.
      - run: make test-mapping-site-js
      - run: make test-viewer-js
      - run: make test-showcase-js

  # The analysis scripts under research/ compute the numbers that go into the papers, so they
  # are linted as the Rust half is. The ruff version is pinned for the same reason the rule set
  # is pinned in the root ruff.toml: an unpinned linter turns CI red on a day nobody touched the
  # code. The three directories are the same three `make lint-python` covers.
  python-lint:
    name: ruff + pytest (research/, scripts/, assets/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.4
          args: check
          src: research scripts assets

      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.4
          args: format --check
          src: research scripts assets

      # The Gentoo ebuild names every dependency crate, generated from Cargo.lock. A lock
      # change that does not reach the ebuild produces a package that fails to build for users
      # while looking perfectly fine in review, so it is checked rather than remembered.
      - name: Gentoo CRATES list is in sync with Cargo.lock
        run: python3 scripts/generate_gentoo_crates.py --check

      # The AUR, Gentoo and Nix recipes repeat Cargo.toml's version by hand; a recipe left on the
      # previous number builds the previous tag under the new one. See the script's docstring.
      - name: Packaging recipes name Cargo.toml's version
        run: make check-versions

      # THIRD-PARTY-NOTICES.md ships beside every binary and LICENSE-COMMERCIAL points at it, so a
      # dependency change has to reach it; generated from Cargo.lock, so checked against it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Third-party notices are in sync with Cargo.lock
        run: make check-third-party-notices

      # The Python unit tests, in research/'s uv environment (pytest is a dev dependency there).
      - uses: astral-sh/setup-uv@v7

      - run: make test-python

  # The release gate, run on every push rather than only at deploy time - a regression is far
  # cheaper to find on the commit that caused it than in the middle of a release. Safe to gate in
  # CI because it is algorithm-only: mismatch counts against the human mapping do not vary by
  # machine (unlike the runtime figure, which `make check-quality` only warns on).
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: quality

      # `test-fixtures`, not the Makefile's default `stats`: the gate needs no git2/rusqlite, and
      # keeping them out of this job's cache is worth the one override.
      - run: make check-quality FEATURES=test-fixtures

  # The painting counterpart of the quality gate, and gated here for the same reason: byte counts
  # against the hand-painted ground truth are algorithm-only and do not vary by machine. It
  # separates what a reader sees from the part of it no matcher improvement can remove - see the
  # target's own comment in the Makefile for why this baseline, unlike the quality one, moves when
  # the ground truth is improved.
  painting:
    name: painting gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: painting

      - run: make check-painting-attribution

  # The suite on the two other operating systems the release ships binaries for, with default
  # features: the fixture corpus is feature-independent and already sharded across the Linux
  # matrix below, so it is left out here (`test::fixtures::`) and the rest runs whole. Without this
  # job, release.yml is the first time macOS or Windows compiles the crate, and no test ever runs
  # there.
  cross-platform:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}

      - uses: taiki-e/install-action@nextest

      # --no-fail-fast: a platform-specific failure is rarely alone, and one run that lists them
      # all beats one push per failure.
      - run: cargo nextest run --cargo-profile ci --no-fail-fast -E 'not test(/^test::fixtures::/)'

  # Cargo.toml's `rust-version` is a promise to `cargo install` users on an older toolchain, and
  # only a build on exactly that toolchain keeps it: a dependency bump can raise the real floor
  # without any line of this crate changing. The version appears twice below on purpose - the
  # action needs a literal ref - and the first step fails if it drifts from Cargo.toml.
  msrv:
    name: cargo check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The toolchain below is Cargo.toml's rust-version
        run: grep -q '^rust-version = "1.92"$' Cargo.toml

      - uses: dtolnay/rust-toolchain@1.120

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - run: cargo check --locked

  # The picture view's graphics detection, end to end in a real tmux with two clients (one a fake
  # kitty that answers the graphics query): unit tests cannot reach tmux's passthrough, which is
  # where the protocol detection went wrong. `make test-graphics` falls back to podman, which the
  # runner has, when tmux is not installed.
  graphics:
    name: graphics detection (tmux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: graphics

      - run: make test-graphics

  # `cargo publish --dry-run` without the upload: packages the crate from `include` and builds it
  # from its own tarball, so a file the allow-list dropped (an `include_str!` target, a module)
  # fails here rather than at `make deploy-crates`, which publishes first and cannot be undone.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: package

      - run: cargo package --locked

  build-and-test:
    name: build + test (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "" = default features (tui only). test-fixtures and stats are each their own
        # compilation unit - see Cargo.toml's [features] - so each needs its own build+test pass,
        # not just a single default-feature run.
        #
        # `shard` pairs each of those with one third of the fixture corpus - see the two Test
        # steps below for why. Written as `include:` so the two stay paired; a second list axis
        # would give nine jobs.
        include:
          - { features: "", shard: 1 }
          - { features: "test-fixtures", shard: 2 }
          - { features: "stats", shard: 3 }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --profile ci --features "${{ matrix.features }}"

      # nextest: one process per test, so src/test/helper.rs's fixture caches are freed after each
      # (see CONTRIBUTING.md). The src/test/fixtures/ tests touch nothing feature-gated, so each job
      # runs one third of them (--partition, deterministic by name) and the three jobs together run
      # each once. test() matches names without the crate prefix: ^omnidiff::test::fixtures::
      # matches nothing and CI stays green - check `cargo nextest list -E '<expr>'` before editing.
      - name: Test (what this feature set changes)
        run: cargo nextest run --cargo-profile ci --features "${{ matrix.features }}"
          -E 'not test(/^test::fixtures::/)'

      - name: Test (one third of the fixture corpus)
        run: cargo nextest run --cargo-profile ci --features "${{ matrix.features }}"
          -E 'test(/^test::fixtures::/)'
          --partition count:${{ matrix.shard }}/3
