# Builds the Nix recipe (flake.nix + packaging/nix/package.nix), the one packaging path that works
# straight from the repository. Its own workflow rather than a CI job: the build compiles every
# crate and every tree-sitter grammar under the release profile's fat LTO, ten to fifteen minutes
# uncached, so it runs only when an input of the recipe changes and once a week - the weekly run
# is what catches nixpkgs moving underneath a lock file nobody touched.
name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - packaging/nix/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/nix.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23

      # Evaluates every output for every default system (packages, app, devShell), which is where
      # a typo in the flake surfaces, without building any of them.
      - run: nix flake check -L --no-build

      - run: nix build .#omnidiff -L

      # The derivation's own test phase runs the library tests; this proves the installed binary
      # and the generated man page and completions are there, which is what a packager checks.
      - run: |
          ./result/bin/omnidiff --version
          test -s ./result/share/man/man1/omnidiff.1.gz
          test -s ./result/share/bash-completion/completions/omnidiff.bash
          test -s ./result/share/zsh/site-functions/_omnidiff
          test -s ./result/share/fish/vendor_completions.d/omnidiff.fish
