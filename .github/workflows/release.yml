name: Release binaries

# A `v*` tag only. There is no `workflow_dispatch`: every job attaches to the release named by the
# tag, and a manual run on a branch has no tag to attach to. To redo a release, re-run this run
# (`gh run rerun <id>`), or delete the tag and release and push the tag again.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Creates the release first, as a draft, with the tagged version's CHANGELOG.md section as its
  # body. Every other job uploads into this draft; `checksums`, which runs last, publishes it. Users
  # therefore never see a release with half its assets, and a tag whose CHANGELOG section is missing
  # (or still says "unreleased") fails here, before anything is built.
  release:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract this version's section from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'EOF'
          import re
          import sys

          version = sys.argv[1].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\] - (?P<date>[^\n]*)\n(?P<body>.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(f"CHANGELOG.md has no `## [{version}] - <date>` section for tag {sys.argv[1]}")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", match["date"].strip()):
              sys.exit(f"CHANGELOG.md's [{version}] heading says '{match['date']}', not a release date")
          body = match["body"].strip()
          if not body:
              sys.exit(f"CHANGELOG.md's [{version}] section is empty")
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          EOF
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true

  build:
    name: ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # For the provenance attestations below.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not ubuntu-latest: the binary links against the runner's glibc, and a
          # user's glibc has to be at least that new. 22.04's is 2.35, which Ubuntu 22.04, Debian
          # 12 and RHEL 9 all meet; 24.04's 2.39 would shut every one of them out.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # The only target here that needs a cross toolchain installed: the macOS pair cross-
          # compiles too, but Xcode ships both slices. Same glibc reasoning as above: the cross
          # toolchain's sysroot is the runner's release.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: aarch64-linux-gnu
          # Static binaries: run on any Linux, any glibc or none (Alpine containers, distributions
          # older than the glibc 2.35 the gnu builds need). Cross-compiled with cargo-zigbuild,
          # whose zig is the C compiler and linker for the grammars as well as the Rust.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            zig: true
            cross: aarch64-linux-musl
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Both variables are needed, and for different consumers: cargo uses the LINKER to link the
      # Rust code, while the `cc` crate uses CC to compile the bundled tree-sitter grammars,
      # which are C. Setting only the linker produces host-architecture objects and a link failure
      # that reads as if the toolchain were missing.
      - name: Install cross toolchain
        if: matrix.cross && !matrix.zig
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.cross }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_$(echo ${{ matrix.target }} | tr '-' '_')=${{ matrix.cross }}-gcc" >> "$GITHUB_ENV"

      # Default features (`tui`) only - this is the `omnidiff` product binary, not the
      # test-fixtures/stats-gated dev tools in src/bin/. `--locked`: the committed Cargo.lock is
      # what CI tested and what `cargo publish --locked` ships.
      - name: Build
        if: "!matrix.zig"
        run: cargo build --release --locked --target ${{ matrix.target }} --bin omnidiff

      # The musl targets: zig is the C compiler and linker for the grammars as well as the Rust,
      # for both architectures, so no per-architecture toolchain package is needed.
      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install zig
        if: matrix.zig
        uses: mlugg/setup-zig@v2

      - name: Build (zig)
        if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }} --bin omnidiff

      # A musl binary is only worth shipping if it is static: a dynamic one would still need a
      # musl loader on the user's machine, which a glibc distribution does not have.
      - name: Verify static linking
        if: matrix.zig
        run: |
          file target/${{ matrix.target }}/release/omnidiff
          file target/${{ matrix.target }}/release/omnidiff | grep -q 'static' \
            || { echo "::error::musl binary is not statically linked"; exit 1; }

      # A cross-compiled binary cannot be run here to check it, so check what it *is*. A silent
      # fallback to the host compiler would otherwise ship an x86-64 binary under an arm64 name,
      # and the first sign would be an exec-format error on a user's machine.
      - name: Verify architecture
        if: matrix.cross
        run: |
          file target/${{ matrix.target }}/release/omnidiff
          file target/${{ matrix.target }}/release/omnidiff | grep -q 'ARM aarch64' \
            || { echo "::error::built binary is not aarch64"; exit 1; }

      # The binary at the archive root (which is what `[package.metadata.binstall]` in Cargo.toml
      # promises `cargo binstall`), with the license and README beside it: an AGPL binary travels
      # with its license text.
      #
      # Deliberately not generated per-target here: `omnidiff util man`/`util completions` need to
      # *run* the binary, and one of these targets is always cross-compiled (macos-latest is
      # arm64, so x86_64-apple-darwin is the odd one out and would need Rosetta). The output is
      # identical for every platform anyway - it is derived from the clap definition, not from the
      # host - so the `assets` job below builds it once and ships it as its own artifact.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/omnidiff LICENSE THIRD-PARTY-NOTICES.md README.md dist/
          tar czf omnidiff-${{ matrix.target }}.tar.gz -C dist omnidiff LICENSE THIRD-PARTY-NOTICES.md README.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist
          Copy-Item target/${{ matrix.target }}/release/omnidiff.exe, LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath omnidiff-${{ matrix.target }}.zip

      # Signed provenance (which workflow, commit and runner produced this file), verifiable with
      # `gh attestation verify omnidiff-<target>.tar.gz --repo ivankovic/omnidiff`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: omnidiff-${{ matrix.target }}.*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: omnidiff-${{ matrix.target }}.*

  # Shell completions and the man page, generated once on a native Linux runner. Every packaging
  # recipe under packaging/ generates these itself from its own freshly built binary, so this
  # artifact is for people installing a prebuilt binary by hand rather than through a package.
  assets:
    name: completions + man page
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-assets

      - name: Build and generate
        run: |
          cargo build --release --locked --bin omnidiff
          mkdir -p dist/completions
          ./target/release/omnidiff util man > dist/omnidiff.1
          ./target/release/omnidiff util completions bash > dist/completions/omnidiff.bash
          ./target/release/omnidiff util completions zsh > dist/completions/_omnidiff
          ./target/release/omnidiff util completions fish > dist/completions/omnidiff.fish
          ./target/release/omnidiff util completions powershell > dist/completions/omnidiff.ps1
          ./target/release/omnidiff util completions elvish > dist/completions/omnidiff.elv
          tar czf omnidiff-completions-and-man.tar.gz -C dist .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: omnidiff-completions-and-man.tar.gz

  # Unofficial .deb from Cargo.toml's [package.metadata.deb]; see packaging/README.md. The Pages
  # apt repository is built from these.
  deb:
    name: deb (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 for the same glibc reason as the `build` job: `depends = "$auto"` writes the
          # build machine's libc version into the package as its floor.
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            # A native arm64 runner, deliberately unlike the `build` job above, which reaches
            # aarch64 by cross-compiling. Two things in this job cannot cross: `depends = "$auto"`
            # resolves the built ELF's needs against the packages installed on the build machine,
            # which on an x86-64 host would either fail or stamp the host's libc version onto an
            # arm64 package, and the man page and completions are produced by *running* the
            # binary. Both are native operations, so the runner is the cheaper answer.
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-deb-${{ matrix.arch }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # cargo-deb copies assets from disk and cannot run the binary itself, so the man page and
      # completions Cargo.toml's `assets` list points at have to exist before it runs. Building
      # here and passing --no-build below also stops cargo-deb from doing a second release build.
      - name: Build and generate assets
        run: |
          cargo build --release --locked --bin omnidiff
          mkdir -p target/dist
          ./target/release/omnidiff util man > target/dist/omnidiff.1
          ./target/release/omnidiff util completions bash > target/dist/omnidiff.bash
          ./target/release/omnidiff util completions zsh > target/dist/_omnidiff
          ./target/release/omnidiff util completions fish > target/dist/omnidiff.fish

      - name: Package
        run: cargo deb --no-build --output omnidiff_${{ matrix.arch }}.deb

      # Catches an asset path in Cargo.toml going stale: `cargo deb` would happily produce a
      # package missing the man page, and nobody would notice until someone ran `man omnidiff`.
      # The Architecture check is the arm64 counterpart of the `build` job's `file` assertion: a
      # package whose control field disagrees with its contents is one apt will happily offer to
      # the wrong machines.
      - name: Verify contents
        run: |
          dpkg-deb --contents omnidiff_${{ matrix.arch }}.deb
          for path in usr/bin/omnidiff usr/share/man/man1/omnidiff.1 \
                      usr/share/bash-completion/completions/omnidiff; do
            dpkg-deb --contents omnidiff_${{ matrix.arch }}.deb | grep -q " ./$path" \
              || { echo "::error::missing $path in .deb"; exit 1; }
          done
          got="$(dpkg-deb -f omnidiff_${{ matrix.arch }}.deb Architecture)"
          [ "$got" = "${{ matrix.arch }}" ] \
            || { echo "::error::.deb declares Architecture $got, expected ${{ matrix.arch }}"; exit 1; }
          echo "Depends: $(dpkg-deb -f omnidiff_${{ matrix.arch }}.deb Depends)"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: omnidiff_${{ matrix.arch }}.deb

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: omnidiff_${{ matrix.arch }}.deb

  # One SHA256SUMS.txt over every artifact, then the draft becomes the release. Runs last, after
  # every other job has uploaded, so the file covers everything and the release appears complete.
  #
  # The packaging recipes' checksums do NOT come from this file: `aur/PKGBUILD`'s `sha256sums` and
  # the Gentoo Manifest's `.tar.gz` line hash GitHub's auto-generated *source* tarball, which is
  # not a release asset and is not listed here. See "The one thing you cannot skip" in
  # packaging/README.md.
  checksums:
    name: SHA256SUMS + publish
    runs-on: ubuntu-latest
    needs: [build, assets, deb]
    steps:
      - name: Collect and hash every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          # Sorted so the file's line order is stable between runs and a diff between two releases
          # is readable. SHA256SUMS.txt itself is excluded: on a re-run `gh release download`
          # fetches the previous run's copy along with everything else, and it would otherwise be
          # hashed into its own successor.
          sha256sum $(ls | grep -vFx SHA256SUMS.txt | sort) > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: SHA256SUMS.txt

      # A pre-release tag (`v0.1.0-rc1`, anything with a hyphen) is a dry run of this workflow: it
      # builds every asset into the draft and stops there, so nothing reaches users, the apt
      # repository or the Homebrew tap. Delete the draft and the tag afterwards.
      - name: Publish the release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The Homebrew tap (github.com/ivankovic/homebrew-omnidiff) installs the release tarballs by
  # checksum, so its formula can only be written once SHA256SUMS.txt exists. Rendered from
  # packaging/homebrew/omnidiff.rb.in and pushed to the tap; see packaging/README.md, "Homebrew".
  # The push needs the HOMEBREW_TAP_TOKEN secret (a fine-grained token with contents write on the
  # tap repository); without it this warns and the release stands, since the tap is downstream of
  # the release and not part of it.
  homebrew:
    name: update Homebrew tap
    needs: checksums
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render the formula from this release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt
          python3 scripts/render_homebrew_formula.py \
            --version "${TAG#v}" --sums SHA256SUMS.txt --out rendered/omnidiff.rb
          cat rendered/omnidiff.rb

      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the formula was rendered but not pushed"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ivankovic/homebrew-omnidiff.git" tap
          mkdir -p tap/Formula
          cp rendered/omnidiff.rb tap/Formula/omnidiff.rb
          cd tap
          git add Formula/omnidiff.rb
          if git diff --cached --quiet; then
            echo "formula already at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "omnidiff $TAG"
          git push

  # Rebuild the apt repository that GitHub Pages serves, now that the release is public: pages.yml
  # pools the .debs of the last few non-draft releases, so a dispatch before `checksums` publishes
  # the draft would build a repository without the very packages the tag was cut for.
  #
  # Pages has one deployment for the whole site, so this dispatches the workflow that builds the
  # site rather than deploying an apt tree of its own - a second deployment would simply overwrite
  # the first. See .github/workflows/pages.yml.
  apt:
    name: refresh apt repository
    needs: checksums
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      # On `main`, not on the tag: the site generator and the Pages workflow itself are taken from
      # the default branch, while the packages come from the release assets rather than from any
      # checkout. Dispatching a tag ref would run whatever pages.yml looked like at that tag.
      #
      # A workflow_dispatch sent with GITHUB_TOKEN does start a run - it and repository_dispatch
      # are the two documented exceptions to the rule that token-triggered events do not cascade.
      - name: Trigger the Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
