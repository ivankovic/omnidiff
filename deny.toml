# cargo-deny (`cargo deny check bans sources`, the `deny` job in ci.yml): where dependencies may
# come from. Advisories are `cargo audit`'s job and licenses cargo-about's
# (packaging/notices/about.toml), so neither is repeated here.

[graph]
all-features = true

[bans]
# Duplicate versions are common in a tree this size (tree-sitter grammars pin their own `cc`) and
# not a security question.
multiple-versions = "allow"
# A `*` requirement would let any future release in, including a hijacked one.
wildcards = "deny"
# The crate's own path dependencies, if it ever has any, are not a registry risk.
allow-wildcard-paths = true

[sources]
# crates.io only: a git or alternative-registry dependency is a decision, not a surprise.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
